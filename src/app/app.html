<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="profile-section">
      <div class="avatar">NBH</div>
      <h2>{{ employeeData.data.fullName }}</h2>
      <p>{{ employeeData.data.department }}</p>
      <span class="badge">{{ employeeData.data.id }}</span>
    </div>
    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active">Bảng điều khiển</a>
      <a routerLink="/history" routerLinkActive="active">Lịch sử chấm công</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <h1>Hệ Thống Chấm Công</h1>
      <div class="user-actions">
        <button class="btn-outline">Thông báo</button>
        <button 
          class="btn-primary" 
          [style.backgroundColor]="buttonColor"
          (click)="checkIn()">
          Chấm công ngay
        </button>
      </div>
    </header>

    <div class="grid-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
