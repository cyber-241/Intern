<!-- Toast Notifications — Tuần 6: Error Handling -->
@if (notifications().length > 0) {
  <div class="toast-container">
    @for (toast of notifications(); track toast.id) {
      <div class="toast toast-{{ toast.type }}" (click)="dismissToast(toast.id)">
        <span class="material-icons-round toast-icon">
          @switch (toast.type) {
            @case ('success') { check_circle }
            @case ('error') { error }
            @case ('warning') { warning }
            @default { info }
          }
        </span>
        <span class="toast-message">{{ toast.message }}</span>
        <span class="material-icons-round toast-close">close</span>
      </div>
    }
  </div>
}
